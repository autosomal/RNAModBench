# ============================================================
#  RNAModBench — Configuration file for Nanopore RNA
#  modification detection pipeline
#
#  This is the only file users need to edit. After modifying
#  parameters here, simply re-run Snakemake — rules will pick
#  up the new values automatically.
#
#  Parameters marked [NOT YET USED] are declared in the YAML
#  but are not yet wired into the Snakefile; they are placeholders
#  for future releases.
# ============================================================

# ------------------------------------------------------------
# 1. Samples and tools
# ------------------------------------------------------------

# Each sample corresponds to a data/<sample_name>/fast5/ directory.
# Sample names must match directory names exactly (case-sensitive).
# Control samples live alongside treatment samples — paired
# tools (Nanocompore / xPore / yanocomp / Epinano_DiffErr /
# DRUMMER) will be paired automatically.
samples:
  - sample1
  - sample2
  - control1
  - control2

# Tools to execute. Comment out entries you wish to skip.
# See docs/TOOLS_OVERVIEW.md for data requirements per tool.
tools:
  - CHEUI
  - ELIGOS2
  - m6Anet
  - Nanocompore
  - DENA
  - Epinano
  - Epinano_DiffErr
  - DRUMMER
  - MINES
  - xPore
  - yanocomp
  - NanoSPA

# Directory paths (relative to the Snakefile location)
data_dir:      "data"       # directory containing <sample>/fast5/
reference_dir: "reference"  # genome.fa / transcriptome.fa / genes.gtf
results_dir:   "results"    # all output is written here

# ============================================================
# 2. Base pipeline parameters
# ============================================================

# Guppy basecalling.
#   config              : Guppy configuration file (must match the
#                         GPU/CPU model in use)
#   num_callers         : number of parallel worker processes
#   threads_per_caller  : CPU threads allocated to each worker
#   total_threads       : total thread count declared to Snakemake
guppy:
  config: "rna_r9.4.1_70bps_hac.cfg"
  num_callers: 4
  threads_per_caller: 20
  total_threads: 80

# minimap2 alignment thread count (used for both transcriptome
# and genome alignment)
alignment:
  threads: 40

# nanopolish eventalign — generates the signal-level input
# consumed by CHEUI / m6Anet / Nanocompore / xPore / yanocomp.
# Use ≤ 20 threads for very large datasets to avoid
# memory exhaustion.
nanopolish:
  threads: 40

# ============================================================
# 3. Per-tool parameters
# ============================================================

# CHEUI — Deep-learning-based m6A detection.
#   kmer_model     : k-mer intensity lookup table (CSV)
#   model1        : stage-1 (pre-screen) HDF5 model
#   model2        : stage-2 (refined) HDF5 model
#   threads       : CPU threads for inference
#   prob_threshold : stage-2 probability cutoff (default 0.999 is very strict)
#   ratio_threshold : minimum estimated stoichiometry
cheui:
  kmer_model:      "resources/CHEUI/kmer_models/model_kmer.csv"
  model1:          "resources/CHEUI/CHEUI_trained_models/CHEUI_m6A_model1.h5"
  model2:          "resources/CHEUI/CHEUI_trained_models/CHEUI_m6A_model2.h5"
  threads:         40
  prob_threshold:  0.999
  ratio_threshold: 0.1

# ELIGOS2 — Alignment-level statistical mismatch test.
#   threads        : parallel thread count (one worker per region)
#   max_depth       : per-site maximum read depth (very high values
#                    cause over-fitting)
#   min_depth       : minimum per-site coverage (noise filter)
#   padj_threshold : BH-corrected p-value upper bound (very strict by default)
#   oddr_threshold  : lower bound on odds ratio (> 1.2 implies
#                        treatment is more modified than control)
eligos2:
  threads:        12
  max_depth:      2000000
  min_depth:       5
  padj_threshold:  0.0001
  oddr_threshold:  1.2

# m6Anet — Deep probabilistic model for m6A detection.
#   dataprep_threads  : threads for the event-reading pre-processing step
#   inference_threads : threads for the model-inference step
#   readcount_max    : upper bound on reads per transcript (memory guard)
#   prob_threshold  : minimum probability to call a site m6A
#   ratio_threshold : minimum estimated stoichiometry
m6anet:
  dataprep_threads:  12
  inference_threads: 40
  readcount_max:     2000000
  prob_threshold:    0.5
  ratio_threshold:   0.1

# Nanocompore — Contrast tool; compares signal-intensity distributions
# between two samples.
#   threads          : parallel threads
#   min_coverage     : minimum reads per site
#   min_ref_length   : minimum transcript length (filters short transcripts)
#   pvalue_threshold : upper bound on GMM p-value
#   lor_threshold    : lower bound on absolute log-odds-ratio (effect size)
nanocompore:
  threads:          20
  min_coverage:     5
  min_ref_length: 10
  pvalue_threshold: 0.05
  lor_threshold:  0.5

# DENA — LSTM-based direct prediction of m6A from raw signal.
#   motif             : target motif (IUPAC degenerate notation;
#                       R = A/G, H = A/C/U)
#   corr_grp          : name of the Tombo-corrected signal group
#   windows            : upstream/downstream window around the target site
#   processes          : number of parallel processes
#   model              : path to the LSTM model directory
#   ratio_threshold    : minimum estimated stoichiometry
#   coverage_threshold : minimum read coverage
dena:
  motif:              "RRACH"
  corr_grp:           "RawGenomeCorrected_000"
  windows:            "2 2"
  processes:          40
  model:              "resources/DENA/DENA_LSTM_Model"
  ratio_threshold:    0.1
  coverage_threshold: 20

# Epinano — Detection based on base-calling error profile.
#   threads         : parallel threads
#   model           : trained SVM model file (linear.dump / svm.dump)
#   columns         : feature columns (comma-separated, 1-based index);
#                     default "8,13,23" corresponds to
#                     quality / mismatch / deletion columns.
#   delta_threshold : minimum delta-error difference between treatment
#                     and control (used only by Epinano_DiffErr)
epinano:
  threads:         12
  model:          "resources/Epinano/models/rrach.q3.mis3.del3.linear.dump"
  columns:         "8,13,23"
  delta_threshold: 0.1

# DRUMMER — Contrast tool; tests coverage differences between
# treatment and control.
#   threads             : parallel threads
#   max_depth / min_depth : coverage bounds
#   pvalue_threshold    : upper bound on test p-value
#   frac_diff_threshold : lower bound on treatment/control proportion
#                         difference (effect size)
drummer:
  threads:            12
  max_depth:          2000000
  min_depth:          5
  pvalue_threshold:   0.05
  frac_diff_threshold: 0.1

# MINES — Machine-learning approach built on Tombo fraction_modified signal.
#   kmer_models        : k-mer model list file (names.txt)
#   coverage_threshold : sites below this coverage are skipped
#   ratio_threshold    : minimum fraction of modified reads
mines:
  kmer_models:        "resources/MINES/Final_Models/names.txt"
  coverage_threshold: 20
  ratio_threshold:    0.1

# Tombo base parameters (used by MINES; Tombo itself is a
# standalone modification detector).
tombo:
  corr_grp:      "RawGenomeCorrected_000"   # signal group after correction
  basecall_grp:  "Basecall_1D_000"          # raw base-call group name
  processes:     12                         # parallel processes

# xPore — Contrast tool; Gaussian-mixture-based differential m6A.
#   dataprep_threads : threads for the pre-processing step
#   readcount_max    : upper bound on reads per transcript (memory guard)
#   prob_threshold   : minimum differential-modification probability
#                       (higher is stricter)
xpore:
  dataprep_threads: 40
  readcount_max:    2000000
  prob_threshold:   0.5

# yanocomp — Contrast tool; GMM-based differential testing
# modification detection between two samples.
#   prep_threads     : threads for the eventalign → HDF5 preprocessing step
#   test_threads     : threads for the GMM testing step
#   n_components     : number of Gaussian mixture components
#                       (typically 50; larger → finer but slower)
#   fdr              : Benjamini–Hochberg FDR control
#   pvalue_threshold : additional hard p-value filter
yanocomp:
  prep_threads:      8
  test_threads:      8
  n_components:      50
  fdr:               0.05
  pvalue_threshold:  0.05

# NanoSPA — Simultaneous detection of m6A and Ψ (pseudouridine).
#   prob_threshold : minimum modification probability (output filter)
nanospa:
  prob_threshold: 0.5

# ============================================================
# 4. Utility-tool parameters
# ============================================================

utilities:
  # Path to the R2Dtool executable (used for transcriptome →
  # coordinate liftover). Requires separate compilation
  # (git clone + cargo build --release).
  r2d_tool: "resources/R2Dtool/target/release/r2d"

# ============================================================
# 5. Reference files — explicitly declared; used by the Snakefile
# ============================================================

reference_files:
  genome:        "reference/genome.fa"
  transcriptome: "reference/transcriptome.fa"
  genes_gtf:     "reference/genes.gtf"
  genes_bed:     "reference/genes.bed"

# ============================================================
# 6. Reserved parameters — [NOT YET USED]
#    The following keys are declared in the configuration but
#    are not yet wired into the current Snakefile release.
#    Modifying them will not affect the pipeline.
# ============================================================

# Whether to auto-generate transcriptome.fa / genes.bed
# (current release expects users to prepare these manually,
# or pre-process externally with tools such as gffread).
create_transcriptome:    true          # [NOT YET USED]
convert_gtf_to_bed:      true          # [NOT YET USED]
create_gene_annotations: true          # [NOT YET USED]

# QC parameters (reserved for a future automated-QC release).
qc:
  min_read_length: 50                   # [NOT YET USED]
  min_read_quality: 7                   # [NOT YET USED]
  min_coverage:    20                   # [NOT YET USED]
  max_coverage:    10000                # [NOT YET USED]

# Output-format control (current release hard-codes 7-column TSV
# output plus liftover).
output:
  bed_format:          true             # [NOT YET USED]
  liftover_to_genome:  true             # [NOT YET USED]
  include_5mer_context: true            # [NOT YET USED]

# Upper compute-resource caps (not used in this release;
# Snakemake is driven through the --cores flag).
resources:
  max_memory: "128G"                    # [NOT YET USED]
  max_cpus:   40                        # [NOT YET USED]
  gpu_available: true                   # [NOT YET USED]
  gpu_devices:  [0, 1]                  # [NOT YET USED]

# Logging and debugging (not wired in yet).
logging:
  level:             "INFO"             # [NOT YET USED]
  save_intermediates: false             # [NOT YET USED]
  cleanup_temp_files: true              # [NOT YET USED]

# Species (used by tools for selecting internal default-value selection;
# not wired in yet).
species:
  name:            "Generic"            # [NOT YET USED]
  codon_table:     "standard"           # [NOT YET USED]
  mitochondrial_genome: false           # [NOT YET USED]
  annotation_source: "Ensembl"          # [NOT YET USED]
