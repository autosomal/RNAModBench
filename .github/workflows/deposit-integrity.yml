name: deposit integrity

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check paths, syntax, callset counts and figure index
        run: python scripts/verify_deposit.py
      - name: Assert the committed checksum file matches the tree just hashed
        run: git diff --exit-code metadata/deposited_files.sha256
